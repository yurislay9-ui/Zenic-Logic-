# ============================================================
#  TITAN OMNISCALE X v16 - Docker Compose (Production)
#  Phase 3: VPS Deploy + Phase 4: Distributed Orchestration
#
#  Services:
#    - app:      FastAPI application (Gunicorn + Uvicorn workers)
#    - worker:   Distributed task worker (Phase 4)
#    - db:       PostgreSQL 16 with auto-setup + coordination schema
#    - redis:    Redis 7 for pub/sub + caching (Phase 4)
#    - nginx:    Reverse proxy + SSL termination
#    - backup:   Scheduled database backups
#
#  Usage:
#    docker compose up -d                        # Start core services
#    docker compose up -d --scale worker=3       # Start with 3 workers
#    docker compose logs -f app                  # Follow app logs
#    docker compose exec db psql -U titan titan_db  # DB shell
#    docker compose run --rm backup              # Manual backup
#
#  Phase 4 — Distributed Orchestration:
#    docker compose --profile distributed up -d  # Enable all Phase 4 services
#    docker compose --profile distributed up -d --scale worker=5
#
#  SSL:
#    Set TITAN_DOMAIN in .env.production, then:
#    docker compose run --rm certbot   # Obtain SSL cert
# ============================================================

services:
  # ── PostgreSQL Database ──────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: titan-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-titan_db}
      POSTGRES_USER: ${POSTGRES_USER:-titan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-titan} -d ${POSTGRES_DB:-titan_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - titan-internal
    # Do NOT expose PostgreSQL port externally
    # Only accessible from app/worker containers via titan-internal network

  # ── Redis (Phase 4: Pub/Sub + Caching + Session Store) ──
  redis:
    image: redis:7-alpine
    container_name: titan-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - titan-internal
    # Redis NOT exposed externally — only accessible internally

  # ── FastAPI Application ──────────────────────────────────
  app:
    build:
      context: .
      target: production
    container_name: titan-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-titan}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-titan_db}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-titan}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-titan_db}
      # Redis
      REDIS_URL: redis://redis:6379/0
      # Auth
      TITAN_AUTH_SECRET: ${TITAN_AUTH_SECRET:?TITAN_AUTH_SECRET required}
      TITAN_AUTH_ENABLED: "true"
      TITAN_SERVER_MODE: fastapi
      TITAN_ENV: production
      # Data
      TITAN_DATA_DIR: /home/titan/.titan_omniscale/data
      # Resources
      TITAN_RAM_LIMIT_MB: ${TITAN_RAM_LIMIT_MB:-2048}
      TITAN_WORKERS: ${TITAN_WORKERS:-4}
      # Phase 4: Distributed Orchestration
      TITAN_COORDINATION_BACKEND: ${TITAN_COORDINATION_BACKEND:-postgresql}
      TITAN_NODE_ID: ${TITAN_NODE_ID:-app-primary}
      TITAN_HEARTBEAT_INTERVAL: ${TITAN_HEARTBEAT_INTERVAL:-10}
      TITAN_LEASE_DURATION: ${TITAN_LEASE_DURATION:-120}
      # GitHub (optional)
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - app_data:/home/titan/.titan_omniscale/data
      - ./src/config/settings.yaml:/app/src/config/settings.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - titan-internal
      - titan-public
    # App listens on 5000 internally; nginx proxies to it
    expose:
      - "5000"

  # ── Distributed Worker (Phase 4) ────────────────────────
  worker:
    build:
      context: .
      target: production
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-titan}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-titan_db}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-titan}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-titan_db}
      # Redis
      REDIS_URL: redis://redis:6379/0
      # Auth (workers need auth for tenant-aware operations)
      TITAN_AUTH_SECRET: ${TITAN_AUTH_SECRET:?TITAN_AUTH_SECRET required}
      TITAN_AUTH_ENABLED: "true"
      TITAN_SERVER_MODE: worker
      TITAN_ENV: production
      # Data
      TITAN_DATA_DIR: /home/titan/.titan_omniscale/data
      # Resources
      TITAN_RAM_LIMIT_MB: ${TITAN_RAM_LIMIT_MB:-1024}
      # Phase 4: Distributed Orchestration
      TITAN_COORDINATION_BACKEND: ${TITAN_COORDINATION_BACKEND:-postgresql}
      TITAN_NODE_ID: ""  # Auto-generated per worker instance
      TITAN_HEARTBEAT_INTERVAL: ${TITAN_HEARTBEAT_INTERVAL:-10}
      TITAN_LEASE_DURATION: ${TITAN_LEASE_DURATION:-120}
      TITAN_WORKER_QUEUES: ${TITAN_WORKER_QUEUES:-pipeline,saga,generation}
      # GitHub (optional)
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - app_data:/home/titan/.titan_omniscale/data
    entrypoint: ["python", "-m", "src.core.distributed.worker_entrypoint"]
    networks:
      - titan-internal
    # Workers are NOT exposed to public network
    deploy:
      replicas: ${TITAN_WORKER_REPLICAS:-2}
      resources:
        limits:
          memory: ${TITAN_WORKER_RAM_MB:-1024}M

  # ── Nginx Reverse Proxy + SSL ────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: titan-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_data:/etc/letsencrypt:ro
      - nginx_logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - titan-public

  # ── Certbot (Let's Encrypt SSL) ──────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: titan-certbot
    profiles:
      - ssl
    volumes:
      - certbot_data:/etc/letsencrypt
      - ./deploy/nginx/certbot-webroot:/var/www/certbot:ro
    command: certonly --webroot --webroot-path=/var/www/certbot --email ${SSL_EMAIL:-admin@example.com} --agree-tos --no-eff-email -d ${TITAN_DOMAIN:-localhost}
    networks:
      - titan-public

  # ── Scheduled Backups ────────────────────────────────────
  backup:
    image: postgres:16-alpine
    container_name: titan-backup
    restart: "no"
    profiles:
      - backup
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-titan}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      PGDATABASE: ${POSTGRES_DB:-titan_db}
    volumes:
      - backup_data:/backups
      - ./deploy/scripts/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    networks:
      - titan-internal

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  app_data:
    driver: local
  certbot_data:
    driver: local
  nginx_logs:
    driver: local
  backup_data:
    driver: local

networks:
  titan-internal:
    driver: bridge
    internal: true  # No external access
  titan-public:
    driver: bridge
