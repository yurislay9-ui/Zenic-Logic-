name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yq autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev libltdl-dev zip unzip
          pip install --upgrade pip setuptools wheel
          pip install buildozer cython virtualenv

      - name: Build APK with debug log
        run: |
          buildozer android debug 2>&1 | tee build_output.txt
        continue-on-error: true

      - name: Show full build log
        if: always()
        run: |
          echo "========== BUILD LOG (ultimas 200 lineas) =========="
          tail -200 build_output.txt 2>/dev/null || echo "No hay log"

      - name: Find APK files
        if: always()
        run: |
          echo "========== BUSCANDO APK =========="
          find . -name "*.apk" -type f 2>/dev/null
          echo "========== CONTENIDO DE bin/ =========="
          ls -la bin/ 2>/dev/null || echo "No existe bin/"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TITAN_APK
          path: |
            bin/*.apk
            build_output.txt

      - name: Check if APK exists
        if: always()
        run: |
          if ls bin/*.apk 2>/dev/null; then
            echo "APK generado exitosamente!"
          else
            echo "ERROR: No se genero ningun APK"
            echo "Revisa el log arriba para ver el error de buildozer"
          fi
