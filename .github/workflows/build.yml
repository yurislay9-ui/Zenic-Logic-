name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-v2-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-v2-${{ runner.os }}-

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yq autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev libltdl-dev zip unzip

      - name: Install buildozer
        run: |
          pip install --upgrade pip setuptools wheel
          pip install buildozer cython virtualenv

      - name: Build APK
        run: |
          set -o pipefail
          buildozer android debug 2>&1 | tee build_log.txt

      - name: Show APK info
        if: always()
        run: |
          echo "=== Buscando APK ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "No se encontro APK"
          echo "=== Ultimas 100 lineas del log ==="
          tail -100 build_log.txt 2>/dev/null || echo "No hay log"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TITAN_APK
          path: |
            bin/*.apk
            build_log.txt
