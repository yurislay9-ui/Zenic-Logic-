name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt || true
        pip install pytest pytest-asyncio pytest-cov pytest-timeout bandit
    
    - name: Compile check
      run: |
        python -m compileall src/ -q
    
    - name: Run tests with coverage
      run: |
        pytest tests/ --tb=short -q --timeout=30 --timeout-method=thread -p no:ddtrace --cov=src --cov-report=term-missing --cov-fail-under=50
      env:
        PYTHONPATH: .
    
    - name: Security scan with bandit
      run: |
        bandit -r src/ -f json -o bandit-report.json || true
        bandit -r src/ -ll || true
      continue-on-error: true

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install linting tools
      run: pip install flake8 mypy
    - name: Lint with flake8
      run: |
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/ --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics
      continue-on-error: true
    - name: Type check with mypy
      run: |
        mypy src/ --ignore-missing-imports --no-strict-optional || true
      continue-on-error: true
